<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{font:16px sans-serif;margin:12px}.hidden,[hidden]{display:none!important}.modal{display:none}.modal.show{display:block}.dialog{max-width:420px}label{display:block;margin:8px 0}input{height:44px;width:100%;font:inherit}button{font:inherit;padding:10px}.picgift-news-panel{background:#eee;padding:12px}.field span{display:block}
</style><script>
window.__user={id:'11111111-1111-4111-8111-111111111111',email:'fixture@example.invalid'};
window.__calls={oauth:[],feedback:[],news:0,downloads:0,tutorial:0,shares:[],native:[]};
window.__authListeners=[];window.__feedbackError=null;window.__newsDelay=0;
window.picgiftCurrentUser=window.__user;
window.__setUser=user=>{window.__user=user;window.picgiftCurrentUser=user;window.__authListeners.forEach(cb=>cb(user?'SIGNED_IN':'SIGNED_OUT',user?{user}:null));window.dispatchEvent(new CustomEvent('picgift:auth',{detail:{user}}));};
window.addEventListener('picgift:auth',event=>{window.picgiftCurrentUser=event.detail.user;});
if(location.search.includes('native'))window.PicgiftNative={postMessage:s=>window.__calls.native.push(JSON.parse(s))};
document.addEventListener('click',e=>{if(e.target.closest('[data-first-steps]'))window.__calls.tutorial++;if(e.target.closest('[data-download-job]'))window.__calls.downloads++;});
</script><script defer src="/experience.js"></script><script type="module" src="/auth.js"></script><script type="module" src="/announcements.js"></script></head><body>
<button id="opener">Open</button><div class="top-actions"></div><div class="profile-menu"></div><div id="photo-library"></div><div id="toast"></div>
<div id="auth" class="modal show" data-auth-mode="login"><div class="dialog"><h2 id="auth-title">Acceso</h2><p class="auth-caption"></p><button id="google">Google</button><div class="auth-divider">Correo</div><form id="auth-form"><label class="field"><span>Email</span><input type="email" id="auth-email" required></label><label class="field"><span>Contraseña</span><input id="auth-password" type="password" minlength="8" required></label><label class="field"><span>Confirmar</span><input id="auth-password-confirm" type="password"></label><label><input id="terms" type="checkbox"></label><button id="auth-submit" type="submit">Entrar</button></form><button id="reset-pass">Recuperar</button><button id="auth-back">Volver</button><button id="auth-skip-password">Más tarde</button><p id="auth-msg" role="status"></p></div></div><button id="logout">Salir</button><dialog id="app-panel"></dialog>
<button data-share-job="portrait-1">Compartir</button><nav class="mobile-nav"><button data-route="crear">Crear</button></nav>
</body></html>
