name: PICGIFT admin access checks

on:
  push:
    paths:
      - 'admin.html'
      - 'admin.js'
      - 'admin.css'
      - 'supabase/functions/picgift-admin/index.ts'
      - '.github/workflows/admin-access.yml'
  pull_request:
    paths:
      - 'admin.html'
      - 'admin.js'
      - 'admin.css'
      - 'supabase/functions/picgift-admin/index.ts'
      - '.github/workflows/admin-access.yml'

permissions:
  contents: read

jobs:
  admin-access-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate admin JavaScript syntax
        run: node --input-type=module --check < admin.js
      - name: Validate safe login and recovery wiring
        run: |
          node <<'NODE'
          const {readFileSync}=require('node:fs');
          const assert=require('node:assert/strict');
          const js=readFileSync('admin.js','utf8');
          const html=readFileSync('admin.html','utf8');
          const backend=readFileSync('supabase/functions/picgift-admin/index.ts','utf8');
          assert.match(js,/loginMethods/);
          assert.match(js,/last_sign_in_at/);
          assert.match(js,/resetPasswordForEmail\(user\.email/);
          assert.match(js,/user\.confirmed&&user\.email&&methods\.includes\('email'\)/);
          assert.match(js,/window\.confirm/);
          assert.match(html,/account-access-20261009-v1/);
          assert.match(backend,/db\.auth\.getUser\(bearer\)/);
          assert.match(backend,/picgift_admin_users/);
          assert.ok(backend.indexOf('picgift_admin_users')<backend.indexOf('if(action==="list")'));
          assert.match(backend,/app_metadata\?\.providers/);
          assert.doesNotMatch(backend,/(encrypted_password|password_hash|raw_user_meta_data)/);
          console.log('Admin access and recovery checks passed');
          NODE
