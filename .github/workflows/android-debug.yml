name: PICGIFT Android validation and test bundle

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obtener PICGIFT
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android SDK API 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verificar experiencia web
        run: node --test tests/*.test.cjs
      - name: Android Lint, APK y AAB sin firma de subida
        run: gradle -p android --no-daemon :app:lintRelease :app:assembleDebug :app:bundleRelease
      - name: Publicar instalador para pruebas
        uses: actions/upload-artifact@v4
        with:
          name: picgift-android-validation-unsigned
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/reports/lint-results-release.html
          if-no-files-found: error
          retention-days: 7
