name: PICGIFT Android validation and test bundle

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obtener PICGIFT
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android SDK API 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Inyectar Firebase Android (si está configurado)
        env:
          FIREBASE_ANDROID_CONFIG_B64: ${{ secrets.PICGIFT_FIREBASE_ANDROID_JSON_B64 }}
        run: |
          if [ -n "$FIREBASE_ANDROID_CONFIG_B64" ]; then
            printf "%s" "$FIREBASE_ANDROID_CONFIG_B64" | base64 --decode > android/app/google-services.json
            python3 - <<'PY'
          import json
          c=json.load(open("android/app/google-services.json",encoding="utf-8"))
          assert c["project_info"]["project_id"] == "picgift-a7fda", "Unexpected Firebase project"
          assert any(v.get("client_info",{}).get("android_client_info",{}).get("package_name") == "com.picgift.myapp" for v in c["client"]), "Wrong Firebase package"
          PY
          fi
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verificar sintaxis de notificaciones web
        run: |
          node --check native-notifications.js
          node --check app-shell.js
          node --check auth.js
      - name: Android Lint, APK y AAB sin firma de subida
        run: gradle -p android --no-daemon :app:lintRelease :app:assembleDebug :app:bundleRelease
      - name: Publicar instalador para pruebas
        uses: actions/upload-artifact@v4
        with:
          name: picgift-android-validation-unsigned
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/reports/lint-results-release.html
          if-no-files-found: error
          retention-days: 7
      - name: Verificar experiencia web
        run: node --test tests/*.test.cjs
