name: PICGIFT photo selection

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/app/src/main/java/com/picgift/myapp/MainActivity.kt'
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'auth.js'
      - 'google-native.js'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'tests/photo-selection.test.cjs'
      - '.github/workflows/photo-selection.yml'
  push:
    paths:
      - 'android/app/src/main/java/com/picgift/myapp/MainActivity.kt'
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'auth.js'
      - 'google-native.js'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'tests/photo-selection.test.cjs'
      - '.github/workflows/photo-selection.yml'

permissions:
  contents: read

jobs:
  validate-photo-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Verify photo selection, camera, sign-in and permissions
        run: node --test tests/photo-selection.test.cjs
