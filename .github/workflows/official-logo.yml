name: PICGIFT Official Logo Assets

on:
  push:
    paths:
      - assets/halloween/picgift-logo-oficial.svg
      - .github/workflows/official-logo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-brand-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Convert official transparent logo into PWA and Android icon assets
        run: |
          python -m pip install --quiet Pillow pillow-avif-plugin
          python - <<'PY'
          import re, base64, io, os
          from PIL import Image,ImageOps,ImageDraw
          import pillow_avif
          raw=open('assets/halloween/picgift-logo-oficial.svg','r',encoding='utf8').read()
          match=re.search(r'data:image/avif;base64,([A-Za-z0-9+/=]+)',raw)
          if not match: raise SystemExit('Official embedded AVIF missing')
          source=Image.open(io.BytesIO(base64.b64decode(match.group(1)))).convert('RGBA')
          if source.getextrema()[-1][0]!=0: raise SystemExit('Transparent background not found')
          # App icons: full official artwork centered on dark square, with safety padding.
          def square(size):
              img=Image.new('RGBA',(size,size),(12,6,9,255))
              pad=round(size*0.065)
              emblem=source.copy()
              emblem.thumbnail((size-2*pad,size-2*pad),Image.Resampling.LANCZOS)
              img.alpha_composite(emblem,((size-emblem.width)//2,(size-emblem.height)//2))
              return img
          for sz in (192,512):
              p=f'assets/halloween/icon-{sz}.png'
              os.makedirs(os.path.dirname(p),exist_ok=True)
              square(sz).save(p,optimize=True)
          p='android/app/src/main/res/drawable/ic_launcher_official.png'
          os.makedirs(os.path.dirname(p),exist_ok=True)
          square(512).save(p,optimize=True)
          print('Generated icon-192.png, icon-512.png, and Android official launcher asset')
          PY
      - name: Commit generated icon files
        run: |
          git config user.name "PICGIFT Asset Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/halloween/icon-192.png assets/halloween/icon-512.png android/app/src/main/res/drawable/ic_launcher_official.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: official PICGIFT Halloween logo used by PWA and Android icons"
            git push origin HEAD:main
          fi
