name: PICGIFT Official App Icon
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'assets/brand/**'
      - 'assets/halloween/icon-*.png'
      - 'assets/halloween/picgift-favicon-hd.png'
      - 'android/app/src/main/res/drawable-nodpi/ic_launcher_official.png'
      - 'scripts/app-icons.cjs'
      - '.github/workflows/official-logo.yml'
  push:
    branches: [main]
    paths:
      - 'assets/brand/**'
      - 'scripts/app-icons.cjs'
      - '.github/workflows/official-logo.yml'
permissions:
  contents: read
jobs:
  verify-official-icon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify all app icons against the owner-approved source
        run: |
          npm install --prefix "$RUNNER_TEMP/picgift-icons" --no-save --package-lock=false sharp@0.35.5
          NODE_PATH="$RUNNER_TEMP/picgift-icons/node_modules" node scripts/app-icons.cjs --check
