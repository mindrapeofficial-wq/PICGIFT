name: PICGIFT Google Play receipt checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/picgift-google-play/**'
      - 'supabase/functions/_shared/play-purchase.mjs'
      - 'tests/play-receipt.test.cjs'
      - '.github/workflows/play-receipt.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/picgift-google-play/**'
      - 'supabase/functions/_shared/play-purchase.mjs'
      - 'tests/play-receipt.test.cjs'
      - '.github/workflows/play-receipt.yml'

permissions:
  contents: read

jobs:
  verify-receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar acreditación, reembolso y restauración de compras
        run: node --test tests/play-receipt.test.cjs
